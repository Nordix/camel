#
# Publishes the Camel artifacts to Maven Central (Sonatype Central Portal)
# under the org.nordix.camel groupId.
#
# Flow:
#   1. Build the whole reactor and `mvn deploy` it to a LOCAL staging
#      directory (altDeploymentRepository) - produces the full repo layout
#      (poms, jars, sources, javadoc) with no remote, tests skipped.
#   2. Delegate GPG signing + Central Portal upload to the
#      sync-to-maven-central-portal composite action.
#
# Required repository secrets:
#   MAVEN_TOKEN      - base64("username:password") Central Portal token
#   GPG_PRIVATE_KEY  - ASCII-armored GPG private key
#   GPG_PASSPHRASE   - passphrase for the GPG private key
#
# NOTE: USER_MANAGED is the default so the deployment is staged in the
# Portal for review; you then Publish (or Drop) it manually. Use AUTOMATIC
# only when you intend an immediate, irreversible release.

name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      publishing-type:
        description: 'Central Portal publishing type'
        required: true
        type: choice
        default: 'USER_MANAGED'
        options:
          - USER_MANAGED   # staged in the Portal UI for manual review/release (safe default)
          - AUTOMATIC      # validated and released automatically (irreversible)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  STAGING_DIR: ${{ github.workspace }}/target/central-staging

jobs:
  publish-to-central:
    name: Build, Stage and Publish to Central
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check Out Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build the whole reactor and deploy to a LOCAL staging repo (no remote).
      # Tests are skipped (but test-jars are built) so that modules depending on
      # *:tests classifiers still resolve. -Dnoassembly keeps the heavy binary
      # distribution out of the Central bundle.
      - name: Build and stage to local repository
        run: |
          ./mvnw -B -V -e -fae -DskipTests -Dnoassembly -Pdeploy \
            -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
            --no-transfer-progress \
            clean deploy \
            -DaltDeploymentRepository="local::default::file://${STAGING_DIR}"

      - name: Show staged size
        run: |
          echo "Staged repository:"
          du -sh "${STAGING_DIR}" || true
          find "${STAGING_DIR}" -name '*.jar' | wc -l | sed 's/^/jars staged: /'

      - name: Sync to Maven Central Portal
        id: sync
        uses: ./.github/actions/sync-to-maven-central-portal
        with:
          deployment-repository: ${{ env.STAGING_DIR }}
          publishing-type: ${{ github.event.inputs.publishing-type }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          central-token: ${{ secrets.MAVEN_TOKEN }}

      - name: Summary
        run: |
          echo "### Published to Maven Central" >> "$GITHUB_STEP_SUMMARY"
          echo "- groupId: \`org.nordix.camel\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishing type: \`${{ github.event.inputs.publishing-type }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: \`${{ steps.sync.outputs.deployment-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.publishing-type }}" = "USER_MANAGED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Review and release (or Drop) the deployment at https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"
          fi
