#
# Publishes a -SNAPSHOT build of the Camel artifacts to the Sonatype Central
# Portal snapshots repository under the org.nordix.camel groupId.
#
# This is a low-risk test path: SNAPSHOT artifacts are mutable and are NOT
# released to Maven Central proper, so an incorrect push can simply be
# overwritten. Unlike the release workflow, SNAPSHOTs do not require GPG
# signatures, so this deploys straight to the authenticated snapshots
# repository (no local staging / bundle / publisher-upload step).
#
# Required repository secrets:
#   MAVEN_USERNAME - Central Portal token username
#   MAVEN_PASSWORD - Central Portal token password
#
# NOTE: The project version in pom.xml must end with -SNAPSHOT for this
# workflow to run; it fails fast otherwise so a release version can never be
# pushed through the snapshot path by mistake.

name: Publish SNAPSHOT to Maven Central

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CENTRAL_SNAPSHOTS_URL: https://central.sonatype.com/repository/maven-snapshots/

jobs:
  publish-snapshot:
    name: Build and Publish SNAPSHOT
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check Out Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Fail fast unless this is a SNAPSHOT build, so a release version can
      # never be pushed through the snapshot path by mistake.
      - name: Guard SNAPSHOT Version
        id: guard
        run: |
          set -euo pipefail
          version=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -1)
          echo "Detected version: ${version}"
          case "${version}" in
            *-SNAPSHOT)
              echo "version=${version}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Version '${version}' is not a -SNAPSHOT. This workflow only publishes SNAPSHOTs." >&2
              exit 1 ;;
          esac

      # Maven reads deployment credentials from a <server> whose id matches the
      # altDeploymentRepository id. Write a minimal settings.xml at runtime so the
      # token username/password are supplied without committing them.
      - name: Configure Maven Settings
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings-snapshot.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central-snapshots</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Publish SNAPSHOT to Central Snapshots Repository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          ./mvnw -B -V -e -fae -DskipTests -Dnoassembly -Pdeploy \
            -s ~/.m2/settings-snapshot.xml \
            -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
            --no-transfer-progress \
            clean deploy \
            -DaltDeploymentRepository="central-snapshots::default::${CENTRAL_SNAPSHOTS_URL}"

      - name: Summary
        run: |
          echo "### Published SNAPSHOT to Central Snapshots" >> "$GITHUB_STEP_SUMMARY"
          echo "- groupId: \`org.nordix.camel\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.guard.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${CENTRAL_SNAPSHOTS_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify by resolving the metadata, e.g.:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${CENTRAL_SNAPSHOTS_URL}org/nordix/camel/camel-core/${{ steps.guard.outputs.version }}/maven-metadata.xml\`" >> "$GITHUB_STEP_SUMMARY"
